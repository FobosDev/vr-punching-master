# Publishes the game to GitHub Pages (static files, no build step).
#
# One-time setup: Settings → Pages → Build and deployment → Source: "GitHub Actions".
# Do not pick one of the suggested workflows there; this file is the workflow.
#
# Every push to the repository's default branch (whatever it is called) runs the tests and
# deploys. Pushes to other branches only run the tests. To redeploy by hand:
# Actions → "Deploy to GitHub Pages" → Run workflow.
name: Deploy to GitHub Pages

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node test/beatmap.test.mjs

  deploy:
    # Only the default branch publishes the site.
    if: github.ref_name == github.event.repository.default_branch
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    # One deployment at a time; never cancel one that is already running.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Package site
        run: |
          mkdir -p _site
          cp -r index.html style.css src vendor _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
